name: Emu Service CI

on:
  push:
    branches: [main]
    paths:
      - 'emu-service/**'
      - '.github/workflows/emu-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'emu-service/**'
      - '.github/workflows/emu-service.yml'

jobs:
  lint:
    name: Format & Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emu-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: emu-service/go.mod
          # No third-party dependencies yet, so there is no go.sum to cache
          # against; turn caching on when the first one lands.
          cache: false

      - name: gofmt --check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

  test:
    name: Tests (100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emu-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: emu-service/go.mod
          # No third-party dependencies yet, so there is no go.sum to cache
          # against; turn caching on when the first one lands.
          cache: false

      - name: go test
        run: go test -race ./...

      # cmd/emu is a single call into internal/cli and is covered by the
      # end-to-end binary tests instead, which run in a separate process and so
      # cannot report into a coverage profile.
      - name: Coverage gate on the logic packages
        run: |
          go test -coverprofile=cover.out ./internal/...
          go tool cover -func=cover.out | awk '/^total:/ {
            print "total coverage: " $3
            if ($3 != "100.0%") { print "::error::coverage below 100%"; exit 1 }
          }'

  static-binary:
    name: Static binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The binary is mounted into whatever image a lesson runs, so a dynamic
      # link against the builder's libc would break at execution time, not here.
      - name: Build the scratch image
        run: docker build -t emu:ci emu-service

      - name: Assert the binary is static and runs from scratch
        run: |
          docker run --rm emu:ci help
          docker create --name emu-ci emu:ci
          docker cp emu-ci:/emu ./emu
          docker rm emu-ci
          file ./emu
          ! ldd ./emu 2>/dev/null | grep -q . || (echo "emu is dynamically linked" && exit 1)

  sandbox:
    name: Sandbox posture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emu-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: emu-service/go.mod
          # No third-party dependencies yet, so there is no go.sum to cache
          # against; turn caching on when the first one lands.
          cache: false

      - name: Build
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o build/emu ./cmd/emu

      # Proves the supervisor behaves identically to today's sandbox under every
      # constraint rce_service/docker.py applies: no network, dropped caps,
      # read-only rootfs, uid 65534.
      - name: Verify under the real sandbox constraints
        run: ./verify-sandbox.sh
