name: Emu Service CI

on:
  push:
    branches: [main]
    paths:
      - 'emu-service/**'
      - '.github/workflows/emu-service.yml'
  pull_request:
    # feat/emu** covers the stacked emu-service branches, which target the
    # feat/emu integration branch rather than main.
    branches: [main, 'feat/emu**']
    paths:
      - 'emu-service/**'
      - '.github/workflows/emu-service.yml'

jobs:
  lint:
    name: Format & Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emu-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: emu-service/go.mod
          cache-dependency-path: emu-service/go.sum

      - name: gofmt --check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

  test:
    name: Tests (100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emu-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: emu-service/go.mod
          cache-dependency-path: emu-service/go.sum

      - name: go test
        run: go test -race ./...

      # cmd/emu is a single call into internal/cli and is covered by the
      # end-to-end binary tests instead, which run in a separate process and so
      # cannot report into a coverage profile.
      - name: Coverage gate on the logic packages
        run: |
          go test -coverprofile=cover.out ./internal/...
          go tool cover -func=cover.out | awk '/^total:/ {
            print "total coverage: " $3
            if ($3 != "100.0%") { print "::error::coverage below 100%"; exit 1 }
          }'

  static-binary:
    name: Static binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The binary is mounted into whatever image a lesson runs, so a dynamic
      # link against the builder's libc would break at execution time, not here.
      - name: Build the scratch image
        run: docker build -t emu:ci emu-service

      - name: Assert the binary is static and runs from scratch
        run: |
          docker run --rm emu:ci help
          docker create --name emu-ci emu:ci
          docker cp emu-ci:/emu ./emu
          docker rm emu-ci
          file ./emu
          ! ldd ./emu 2>/dev/null | grep -q . || (echo "emu is dynamically linked" && exit 1)

  publish:
    name: Publish into the named volume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # How the binary reaches a lesson: built here, copied into a named volume
      # by the image itself, mounted read-only into the run container. The same
      # three steps `just publish-emu` and the emu-publisher compose service
      # run, against the volume name rce_service/emu.py expects.
      - name: Build the image
        run: docker build -t emu:ci emu-service

      - name: Publish the binary into emu-bin
        run: |
          docker volume create emu-bin
          docker run --rm -v emu-bin:/out emu:ci install /out/emu

      # The posture is rce_service/docker.py:_start_container, limits included:
      # a lesson that cannot run under it here cannot run in production either.
      - name: Run through the mounted binary under the real sandbox posture
        run: |
          docker run --rm \
            --network none \
            --memory 192m --memory-swap 192m \
            --pids-limit 32 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 65534:65534 \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            -v emu-bin:/emu:ro \
            -e GOMAXPROCS=1 -e GOMEMLIMIT=48MiB \
            python:3.11-alpine \
            /emu/emu run -- python3 -c 'print("emu ran from the volume")'

      - name: Assert a run container cannot write the volume
        run: |
          if docker run --rm -v emu-bin:/emu:ro --user 65534:65534 \
              python:3.11-alpine sh -c 'rm -f /emu/emu'; then
            echo "::error::the run container deleted the emu binary"
            exit 1
          fi
          echo "the binary is read-only to the code being graded"

  sandbox:
    name: Sandbox posture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emu-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: emu-service/go.mod
          cache-dependency-path: emu-service/go.sum

      - name: Build
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o build/emu ./cmd/emu

      # Proves the supervisor behaves identically to today's sandbox under every
      # constraint rce_service/docker.py applies: no network, dropped caps,
      # read-only rootfs, uid 65534.
      - name: Verify under the real sandbox constraints
        run: ./verify-sandbox.sh
